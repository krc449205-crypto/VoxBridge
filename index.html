<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VoxBridge</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#07070b;color:#f5e6b3;font-family:Georgia,"Times New Roman",serif;overflow-x:hidden}
body{min-height:100vh;padding:max(22px,env(safe-area-inset-top)) 18px 30px;position:relative}
.gold{position:fixed;inset:0;z-index:0;opacity:0;transition:opacity .9s;pointer-events:none;overflow:hidden;background:linear-gradient(135deg,#2a1b00,#7a5a0a 45%,#2a1b00)}
.gold i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;background:radial-gradient(circle,rgba(255,215,90,.75),rgba(255,180,0,0) 65%);animation:drift 7s ease-in-out infinite alternate}
.gold i:nth-child(1){left:-20vmax;top:-10vmax}
.gold i:nth-child(2){right:-25vmax;top:30vh;animation-duration:9s;animation-delay:-3s}
.gold i:nth-child(3){left:10vmax;bottom:-30vmax;animation-duration:11s;animation-delay:-6s}
@keyframes drift{to{transform:translate(18vmax,12vmax) scale(1.15)}}
body.answering .gold{opacity:1}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto}
h1{font-size:34px;letter-spacing:8px;text-align:center;margin:6px 0 2px;font-weight:700;background:linear-gradient(90deg,#b8860b,#ffe27a,#b8860b);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;font-size:11px;letter-spacing:5px;color:#b9a25a;text-transform:uppercase;margin-bottom:20px}
.langs{display:flex;gap:8px;align-items:center}
select{flex:1;min-width:0;padding:13px 10px;border-radius:14px;border:1px solid rgba(212,175,55,.5);background:rgba(15,15,22,.85);color:#f5e6b3;font-size:16px;font-family:inherit;-webkit-appearance:none;appearance:none;text-align:center}
select option{background:#14141c}
.swap{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid rgba(212,175,55,.6);background:rgba(15,15,22,.85);color:#ffd45a;font-size:20px}
.mics{display:flex;justify-content:center;gap:20px;margin:20px 0 10px}
.mic{width:104px;height:104px;border-radius:50%;border:0;font-size:30px;line-height:1.1;position:relative;color:#2b1d00;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#fff3b0,#e0a800 55%,#8a6200);box-shadow:0 8px 30px rgba(224,168,0,.45),inset 0 0 12px rgba(255,255,255,.4)}
.mic span{font-size:13px;font-weight:700;margin-top:3px}
.mic.listening::before,.mic.listening::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,214,90,.8);animation:ring 1.4s infinite}
.mic.listening::after{animation-delay:.7s}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.7);opacity:0}}
.chip{text-align:center;font-size:13px;letter-spacing:1px;color:#e0c97a;min-height:20px;margin-bottom:6px;text-shadow:0 1px 6px #000}
.stage{position:relative;height:270px;margin:2px 0 6px}
.glow{position:absolute;left:50%;bottom:40px;width:170px;height:170px;margin-left:-85px;border-radius:50%;background:radial-gradient(circle,rgba(255,235,150,.95),rgba(255,200,0,0) 65%);opacity:.25;transform:scale(.5);transition:all .6s}
.stage.open .glow{opacity:1;transform:scale(1.2)}
.chest{position:absolute;left:50%;bottom:6px;width:130px;height:100px;margin-left:-65px;perspective:500px}
.base{position:absolute;bottom:0;left:0;right:0;height:62px;border-radius:6px 6px 12px 12px;background:linear-gradient(180deg,#f7d56a,#b8860b 60%,#7a5800);box-shadow:0 10px 24px rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,240,170,.5)}
.base::after{content:"";position:absolute;left:50%;top:-8px;width:18px;height:22px;margin-left:-9px;border-radius:4px;background:#3a2800;border:2px solid #ffe27a}
.lid{position:absolute;left:-4px;right:-4px;bottom:58px;height:38px;border-radius:22px 22px 4px 4px;background:linear-gradient(180deg,#ffe58a,#c8950f);box-shadow:inset 0 0 0 2px rgba(255,240,170,.5);transform-origin:50% 100%;transition:transform .7s cubic-bezier(.3,1.4,.5,1)}
.stage.open .lid{transform:rotateX(70deg)}
.word{position:absolute;left:50%;bottom:90px;font-size:30px;font-weight:700;color:#fff8dc;text-shadow:0 2px 10px #000,0 0 26px rgba(255,200,0,.9);white-space:nowrap;pointer-events:none;opacity:0;will-change:transform}
.spark{position:absolute;left:50%;bottom:90px;width:6px;height:6px;border-radius:50%;background:#ffe27a;box-shadow:0 0 8px #ffd45a;pointer-events:none}
.card{background:rgba(18,18,26,.75);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(212,175,55,.35);border-radius:18px;padding:14px 16px;margin-top:12px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.label,summary{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#d4af37;margin-bottom:6px}
summary{list-style:none;cursor:pointer;margin:0}
summary::-webkit-details-marker{display:none}
.txt{font-size:19px;line-height:1.45;color:#fff4cf;min-height:26px;word-break:break-word}
#voiceSel{width:100%;margin-top:12px;text-align:left;font-size:14px}
.row{display:flex;align-items:center;gap:10px;margin-top:12px}
.row b{width:60px;font-weight:400;color:#d4af37;font-size:11px;letter-spacing:2px}
input[type=range]{flex:1;accent-color:#e0a800}
.pre{display:flex;gap:8px;margin-top:12px}
.pre button{flex:1;padding:10px;border-radius:12px;border:1px solid rgba(212,175,55,.5);background:rgba(15,15,22,.85);color:#f5e6b3;font-size:14px;font-family:inherit}
.note{font-size:12px;color:#b9a25a;margin-top:10px;line-height:1.4}
.prow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(212,175,55,.15)}
.prow span{flex:1;font-size:16px}
.prow i{color:#b9a25a;font-style:normal;font-size:12px}
.prow button{width:42px;height:34px;border-radius:10px;border:1px solid rgba(212,175,55,.5);background:rgba(15,15,22,.85);color:#ffd45a;font-size:16px}
</style>
</head>
<body>
<div class="gold"><i></i><i></i><i></i></div>
<div class="wrap">
<h1>VOXBRIDGE</h1>
<div class="sub">Luxury Voice Translator</div>
<div class="langs"><select id="from"></select><button class="swap" id="swap">⇄</button><select id="to"></select></div>
<div class="mics">
<button class="mic" id="micA">🎤<span id="nameA">Hindi</span></button>
<button class="mic" id="micB">🎤<span id="nameB">English</span></button>
</div>
<div class="chip" id="stBox">Ready</div>
<div class="stage" id="stage"><div class="glow"></div><div class="chest"><div class="base"></div><div class="lid"></div></div></div>
<div class="card"><div class="label">You said</div><div class="txt" id="heard">...</div></div>
<div class="card"><div class="label">Translation</div><div class="txt" id="out">...</div></div>
<details class="card"><summary>📦 Offline Packs</summary>
<div class="note">Har bhasha ka pack ek baar net se download karo (lagbhag 30MB). Uske baad translation bina net ke chalega.</div>
<div id="packs"></div>
</details>
<details class="card"><summary>🎚 Voice Studio</summary>
<select id="voiceSel"></select>
<div class="row"><b>PITCH</b><input type="range" id="pitch" min="0.5" max="1.8" step="0.05"></div>
<div class="row"><b>SPEED</b><input type="range" id="rate" min="0.6" max="1.4" step="0.05"></div>
<div class="pre"><button id="pDeep">Deep</button><button id="pNorm">Normal</button><button id="pBright">Bright</button></div>
<div class="pre"><button id="test">▶ Test voice</button></div>
</details>
</div>
<script>
const langs=[["hi","hi-IN","Hindi"],["en","en-US","English"],["ur","ur-PK","Urdu"],["bn","bn-IN","Bengali"],["ta","ta-IN","Tamil"],["te","te-IN","Telugu"],["mr","mr-IN","Marathi"],["gu","gu-IN","Gujarati"],["es","es-ES","Spanish"],["fr","fr-FR","French"]];
const $=id=>document.getElementById(id);
const f=$("from"),t=$("to"),stBox=$("stBox"),heard=$("heard"),out=$("out"),stage=$("stage"),packs=$("packs");
const micA=$("micA"),micB=$("micB"),voiceSel=$("voiceSel"),pitch=$("pitch"),rate=$("rate");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let voices=[],cfg={pitch:1,rate:1,v:{}},dl=new Set();
try{Object.assign(cfg,JSON.parse(localStorage.getItem("vb_cfg")||"{}"));}catch(e){}
function save(){try{localStorage.setItem("vb_cfg",JSON.stringify(cfg));}catch(e){}}
function st(m){stBox.textContent=m;}
function pre(i){return langs[i][1].slice(0,2);}
function plugin(n){return window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins[n];}

function fillVoices(){
 voiceSel.innerHTML="";
 voiceSel.add(new Option("Auto voice",""));
 const p=[pre(f.value),pre(t.value)];
 voices.forEach((v,i)=>{if(p.includes((v.lang||"").slice(0,2)))voiceSel.add(new Option((v.name||"voice")+" ("+v.lang+")",i));});
}
async function loadVoices(){
 const T=plugin("TextToSpeech");
 if(!T)return;
 try{voices=(await T.getSupportedVoices()).voices||[];}catch(e){voices=[];}
 fillVoices();
}
function names(){$("nameA").textContent=langs[f.value][2];$("nameB").textContent=langs[t.value][2];fillVoices();}
langs.forEach((l,i)=>{f.add(new Option(l[2],i));t.add(new Option(l[2],i));});
f.value=0;t.value=1;names();
f.onchange=names;t.onchange=names;
$("swap").onclick=()=>{const a=f.value;f.value=t.value;t.value=a;names();};
setTimeout(loadVoices,900);

pitch.value=cfg.pitch;rate.value=cfg.rate;
pitch.oninput=()=>{cfg.pitch=+pitch.value;save();};
rate.oninput=()=>{cfg.rate=+rate.value;save();};
function setPitch(p){cfg.pitch=p;pitch.value=p;save();}
$("pDeep").onclick=()=>setPitch(0.7);
$("pNorm").onclick=()=>setPitch(1);
$("pBright").onclick=()=>setPitch(1.3);
voiceSel.onchange=()=>{
 const i=voiceSel.value;
 if(i==="")cfg.v={};else cfg.v[voices[i].lang.slice(0,2)]=+i;
 save();
};

function drawPacks(){
 packs.innerHTML="";
 langs.forEach(l=>{
  const ok=dl.has(l[0]);
  const r=document.createElement("div");
  r.className="prow";
  r.innerHTML="<span>"+l[2]+"</span><i>"+(ok?"Ready":"Not downloaded")+"</i>";
  const b=document.createElement("button");
  b.textContent=ok?"🗑":"⬇";
  b.onclick=()=>togglePack(l,b);
  r.appendChild(b);
  packs.appendChild(r);
 });
}
async function refreshPacks(){
 const M=plugin("Translation");
 if(!M){packs.innerHTML='<div class="note">Offline plugin nahi mila</div>';return;}
 try{const r=await M.getDownloadedModels();dl=new Set(r.languages||[]);}catch(e){st("Pack list error: "+(e&&e.message?e.message:e));}
 drawPacks();
}
async function togglePack(l,b){
 const M=plugin("Translation");
 if(!M)return;
 b.disabled=true;
 try{
  if(dl.has(l[0])){
   await M.deleteDownloadedModel({language:l[0]});
   st(l[2]+" pack hata diya");
  }else{
   st(l[2]+" pack download ho raha hai...");
   await M.downloadModel({language:l[0]});
   st(l[2]+" pack taiyaar");
  }
 }catch(e){st("Pack error: "+(e&&e.message?e.message:e));}
 await refreshPacks();
}
setTimeout(refreshPacks,1000);

async function speakText(text,lang){
 const T=plugin("TextToSpeech");
 if(T){
  try{
   const o={text:text,lang:lang,rate:cfg.rate,pitch:cfg.pitch,volume:1.0};
   const p=lang.slice(0,2),vi=cfg.v[p];
   if(vi!==undefined&&voices[vi]&&voices[vi].lang.slice(0,2)===p){o.voice=vi;o.lang=voices[vi].lang;}
   await T.speak(o);
   return "Done";
  }catch(e){return "Bolne me error: "+(e&&e.message?e.message:e);}
 }
 if(window.speechSynthesis){
  const s=new SpeechSynthesisUtterance(text);
  s.lang=lang;s.pitch=cfg.pitch;s.rate=cfg.rate;
  speechSynthesis.speak(s);
  return "Done";
 }
 return "Done (bolne wala plugin nahi mila)";
}
$("test").onclick=async()=>{
 const lang=langs[t.value][1];
 const s={"hi-IN":"नमस्ते, मैं वॉक्स ब्रिज हूँ।","en-US":"Hello, I am VoxBridge."}[lang]||"VoxBridge";
 st("Voice test...");
 st(await speakText(s,lang));
};

function sparkle(){
 for(let i=0;i<10;i++){
  const s=document.createElement("div");
  s.className="spark";
  stage.appendChild(s);
  const dx=(Math.random()-0.5)*220,dy=-(40+Math.random()*160);
  const a=s.animate([{transform:"translate(-50%,0) scale(1)",opacity:1},{transform:"translate("+dx+"px,"+dy+"px) scale(.2)",opacity:0}],{duration:900,easing:"ease-out"});
  a.onfinish=()=>s.remove();
 }
}
async function showWords(text){
 const words=text.split(/\s+/).filter(Boolean);
 let last=null;
 for(const w of words){
  const el=document.createElement("div");
  el.className="word";el.textContent=w;
  stage.appendChild(el);
  sparkle();
  last=el.animate([
   {transform:"translate(-50%,40px) scale(.15)",opacity:0},
   {offset:.35,transform:"translate(-50%,-70px) scale(1.5)",opacity:1},
   {offset:.5,transform:"translate(-50%,-80px) scale(1.5)",opacity:1},
   {transform:"translate(-50%,-230px) scale(.15)",opacity:0}
  ],{duration:1300,fill:"forwards"});
  last.onfinish=()=>el.remove();
  await sleep(650);
 }
 if(last){try{await last.finished;}catch(x){}}
}
async function answer(text,lang,mode){
 document.body.classList.add("answering");
 stage.classList.add("open");
 await sleep(600);
 let msg="Done";
 const sp=speakText(text,lang).then(m=>{msg=m;});
 await Promise.all([showWords(text),sp]);
 stage.classList.remove("open");
 document.body.classList.remove("answering");
 st(msg+" · "+mode);
}

async function doTranslate(text,fi,ti){
 const M=plugin("Translation"),a=langs[fi][0],b=langs[ti][0];
 const ready=x=>x==="en"||dl.has(x);
 if(M&&ready(a)&&ready(b)){
  try{
   const r=await M.translate({text:text,sourceLanguage:a,targetLanguage:b});
   if(r&&r.text)return {text:r.text,mode:"Offline"};
  }catch(e){}
 }
 try{
  const u="https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair="+a+"|"+b;
  const d=await (await fetch(u)).json();
  return {text:d.responseData.translatedText,mode:"Online"};
 }catch(e){
  throw new Error("Internet nahi hai aur offline pack bhi nahi mila. Offline Packs se download karo.");
 }
}
async function translateAndSpeak(text,fi,ti){
 st("Translate ho raha hai...");
 const r=await doTranslate(text,fi,ti);
 out.textContent=r.text;
 st("Bol raha hoon... ("+r.mode+")");
 await answer(r.text,langs[ti][1],r.mode);
}

let busy=false;
async function listen(fi,ti,btn){
 if(busy)return;
 busy=true;
 try{
  const SR=plugin("SpeechRecognition");
  if(!SR){st("Speech plugin nahi mila");return;}
  const av=await SR.available();
  if(!av.available){st("Is phone me speech recognition available nahi hai");return;}
  const perm=await SR.requestPermissions();
  if(perm.speechRecognition!=="granted"){st("Mic permission nahi mili");return;}
  st(langs[fi][2]+" sun raha hoon... bolo");
  btn.classList.add("listening");
  let res;
  try{
   res=await SR.start({language:langs[fi][1],maxResults:3,prompt:"Bolo",partialResults:false,popup:true});
  }finally{btn.classList.remove("listening");}
  const text=res&&res.matches&&res.matches[0];
  if(!text){st("Kuch sunai nahi diya, dobara try karo");return;}
  heard.textContent=text;
  await translateAndSpeak(text,fi,ti);
 }catch(e){
  st("Error: "+(e&&e.message?e.message:e));
 }finally{busy=false;}
}
micA.onclick=()=>listen(+f.value,+t.value,micA);
micB.onclick=()=>listen(+t.value,+f.value,micB);
</script>
</body>
 </html>
