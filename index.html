<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoxBridge</title>
<style>
body{font-family:sans-serif;background:#0d1117;color:#fff;margin:0;padding:16px}
h1{text-align:center}
select,button{width:100%;padding:14px;margin:6px 0;font-size:18px;border-radius:10px;border:0}
button{background:#238636;color:#fff}
.box{background:#161b22;padding:12px;border-radius:10px;margin:8px 0;min-height:50px}
</style>
</head>
<body>
<h1>VoxBridge</h1>
<select id="from"></select>
<select id="to"></select>
<button id="mic">🎤 Bolo</button>
<div class="box" id="stBox">Status: ready</div>
<div class="box" id="heard">Aapne kaha: ...</div>
<div class="box" id="out">Translation: ...</div>
<script>
const langs=[["hi","hi-IN","Hindi"],["en","en-US","English"],["ur","ur-PK","Urdu"],["bn","bn-IN","Bengali"],["ta","ta-IN","Tamil"],["te","te-IN","Telugu"],["mr","mr-IN","Marathi"],["gu","gu-IN","Gujarati"],["es","es-ES","Spanish"],["fr","fr-FR","French"]];
const f=document.getElementById("from"),t=document.getElementById("to");
const stBox=document.getElementById("stBox"),heard=document.getElementById("heard"),out=document.getElementById("out");
function st(m){stBox.textContent="Status: "+m;}
langs.forEach((l,i)=>{f.add(new Option(l[2],i));t.add(new Option(l[2],i));});
f.value=0;t.value=1;

function getPlugin(){
 return window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SpeechRecognition;
}

async function translateAndSpeak(text){
 st("Translate ho raha hai...");
 const u="https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair="+langs[f.value][0]+"|"+langs[t.value][0];
 const d=await (await fetch(u)).json();
 const tr=d.responseData.translatedText;
 out.textContent="Translation: "+tr;
 if(window.speechSynthesis){
  const s=new SpeechSynthesisUtterance(tr);
  s.lang=langs[t.value][1];
  speechSynthesis.speak(s);
  st("Done");
 }else{
  st("Done (is phone me awaaz nahi bol sakta)");
 }
}

document.getElementById("mic").onclick=async()=>{
 try{
  const SR=getPlugin();
  if(!SR){st("Speech plugin nahi mila");return;}
  const av=await SR.available();
  if(!av.available){st("Is phone me speech recognition available nahi hai");return;}
  const perm=await SR.requestPermissions();
  if(perm.speechRecognition!=="granted"){st("Mic permission nahi mili");return;}
  st("Sun raha hoon... bolo");
  const res=await SR.start({language:langs[f.value][1],maxResults:1,prompt:"Bolo",partialResults:false,popup:true});
  const text=res&&res.matches&&res.matches[0];
  if(!text){st("Kuch sunai nahi diya, dobara try karo");return;}
  heard.textContent="Aapne kaha: "+text;
  await translateAndSpeak(text);
 }catch(e){
  st("Error: "+(e&&e.message?e.message:e));
 }
};
</script>
</body>
</html>
